<!DOCTYPE html>
<html>
<head>
    <title>Generate App Icons</title>
</head>
<body>
    <h1>Generate App Icons with 🌳 Emoji</h1>
    <p>Open this file in a browser and the icons will be generated automatically.</p>
    
    <canvas id="icon192" width="192" height="192" style="border: 1px solid #ccc; margin: 10px;"></canvas>
    <canvas id="icon512" width="512" height="512" style="border: 1px solid #ccc; margin: 10px;"></canvas>
    
    <div id="downloads"></div>

    <script>
        function generateIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = size;
            canvas.height = size;
            
            // Fill background with green color
            ctx.fillStyle = '#22c55e'; // Green color matching the app theme
            ctx.fillRect(0, 0, size, size);
            
            // Draw emoji
            ctx.font = `${size * 0.7}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🌳', size / 2, size / 2);
            
            // Convert to blob and create download link
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon-${size}x${size}.png`;
                a.textContent = `Download icon-${size}x${size}.png`;
                a.style.display = 'block';
                a.style.margin = '10px';
                document.getElementById('downloads').appendChild(a);
            });
        }
        
        // Generate icons on load
        window.onload = function() {
            generateIcon('icon192', 192);
            generateIcon('icon512', 512);
        };
    </script>
</body>
</html>
